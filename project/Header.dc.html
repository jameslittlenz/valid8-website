<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);font-family:'Onest',system-ui,sans-serif">
  <div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,48px);height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="Home.dc.html" style="display:flex;align-items:center;flex:none"><sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><img src="assets/valid8-logo-dark.png" alt="Valid8 Advisory" style="height:38px;width:auto;display:block"></sc-if><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><img src="assets/valid8-logo-light.png" alt="Valid8 Advisory" style="height:38px;width:auto;display:block"></sc-if></a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:14px">
        <nav style="display:flex;align-items:center;gap:4px">
          <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
            <a href="{{ l.href }}" style="position:relative;padding:10px 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap" style-hover="background:var(--mint);color:var(--ink)">{{ l.label }}<sc-if value="{{ l.active }}"><span style="position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:#1D995B"></span></sc-if></a>
          </sc-for>
        </nav>
        <button onClick="{{ toggleTheme }}" aria-label="Toggle dark mode" style="width:44px;height:44px;flex:none;border:1px solid var(--line2);border-radius:50%;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0" style-hover="border-color:var(--ink)"><sc-if value="{{ isLight }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if><sc-if value="{{ isDark }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if></button>
        <a href="#contact" style="display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap;flex:none" style-hover="background:#348454;color:var(--btn-ink)">Get in touch</a>
      </div>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:8px"><button onClick="{{ toggleTheme }}" aria-label="Toggle dark mode" style="width:44px;height:44px;flex:none;border:1px solid var(--line2);border-radius:50%;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0" style-hover="border-color:var(--ink)"><sc-if value="{{ isLight }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if><sc-if value="{{ isDark }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if></button><button onClick="{{ toggle }}" aria-label="Menu" style="width:44px;height:44px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0">
        <sc-if value="{{ menuClosed }}">
          <span style="width:18px;height:2px;background:var(--ink);border-radius:2px;display:block"></span>
          <span style="width:18px;height:2px;background:var(--ink);border-radius:2px;display:block"></span>
          <span style="width:18px;height:2px;background:var(--ink);border-radius:2px;display:block"></span>
        </sc-if>
        <sc-if value="{{ menuOpen }}">
          <span style="font-size:22px;line-height:1;color:var(--ink)">×</span>
        </sc-if>
      </button></div>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid var(--line);background:var(--surface);padding:12px clamp(20px,5vw,48px) 24px;display:flex;flex-direction:column;gap:4px">
      <a href="Home.dc.html" onClick="{{ close }}" style="padding:14px 4px;font-family:'Sora',sans-serif;font-size:22px;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)">Home</a>
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <a href="{{ l.href }}" onClick="{{ close }}" style="padding:14px 4px;font-family:'Sora',sans-serif;font-size:22px;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">{{ l.label }}<sc-if value="{{ l.active }}"><span style="width:8px;height:8px;border-radius:50%;background:#1D995B"></span></sc-if></a>
      </sc-for>
      <a href="#contact" onClick="{{ close }}" style="margin-top:16px;display:flex;justify-content:center;padding:15px 20px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-size:16px;font-weight:600;text-decoration:none">Get in touch</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;400px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;offerings&quot;,&quot;use-cases&quot;,&quot;about&quot;,&quot;blog&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1200, open: false, dark: typeof document !== 'undefined' && document.documentElement.dataset.theme === 'dark' };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR);
    this.onR();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const a = this.props.active ?? 'home';
    const links = [['offerings', 'Offerings', 'Offerings.dc.html'], ['use-cases', 'Use cases', 'Use%20Cases.dc.html'], ['about', 'About', 'About.dc.html'], ['blog', 'Blog', 'Blog.dc.html']]
      .map(([id, label, href]) => ({ id, label, href, active: id === a }));
    const wide = this.state.w >= 960;
    return {
      links, wide, narrow: !wide, isDark: this.state.dark, isLight: !this.state.dark,
      toggleTheme: () => { const dark = !this.state.dark; document.documentElement.dataset.theme = dark ? 'dark' : 'light'; try { localStorage.setItem('v8-theme', dark ? 'dark' : 'light'); } catch (e) {} this.setState({ dark }); },
      menuOpen: !wide && this.state.open, menuClosed: !this.state.open,
      toggle: () => this.setState(s => ({ open: !s.open })),
      close: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
